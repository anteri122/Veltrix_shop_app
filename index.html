<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veltrix | Premium Forged Wheels & Spacers</title>
    <style>
        :root {
            --accent-orange: linear-gradient(135deg, #ff9d2d 0%, #ff6b00 100%);
            --deep-green: #0b422a; /* Цвет из твоего логотипа */
            --bg-light: #ffffff;
            --card-shadow: 0 10px 30px rgba(0,0,0,0.05);
            --text-main: #1d1d1f;
            --text-secondary: #86868b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* Шапка сайта */
        header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-img {
            width: 35px;
            height: 35px;
            background: var(--accent-orange);
            border-radius: 8px;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
            color: var(--deep-green);
            letter-spacing: -0.5px;
        }

        /* Главный баннер */
        .hero {
            text-align: center;
            padding: 80px 20px;
            background: radial-gradient(circle at 50% 50%, #fdfdfd 0%, #f5f5f7 100%);
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: -1px;
            background: var(--deep-green);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 20px;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.5;
        }

        /* Сетка товаров */
        .container {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 40px;
        }

        .product-card {
            background: #fff;
            border-radius: 24px;
            padding: 24px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            border: 1px solid #f2f2f2;
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--card-shadow);
            border-color: #e5e5e5;
        }

        .product-image {
            width: 100%;
            height: 220px;
            background: #fbfbfd;
            border-radius: 18px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            overflow: hidden;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: #f5f5f7;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--deep-green);
            margin-bottom: 12px;
        }

        .product-name {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 8px 0;
        }

        .product-price {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .btn-buy {
            background: var(--accent-orange);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .btn-buy:active {
            transform: scale(0.96);
        }

        /* Корзина (нижняя плашка) */
        .cart-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--deep-green);
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1001;
        }
    </style>
</head>
<body>

<header>
    <a href="#" class="logo">
        <div class="logo-img"></div>
        <span class="logo-text">VELTRIX</span>
    </a>
    <nav style="display: flex; gap: 30px; font-weight: 500;">
        <span style="cursor:pointer">Диски</span>
        <span style="cursor:pointer">Проставки</span>
        <span style="cursor:pointer">О нас</span>
    </nav>
</header>

<section class="hero">
    <h1>Veltrix Engineering</h1>
    <p>Создаем идеальный вылет и непревзойденную прочность для вашего автомобиля.</p>
</section>

<div class="container">
    <div class="product-card">
        <span class="badge">В наличии</span>
        <div class="product-image">⚙️</div>
        <h3 class="product-name">Проставки 5х112</h3>
        <p class="product-price">от 4 200 ₽</p>
        <button class="btn-buy">Добавить в корзину</button>
    </div>

    <div class="product-card">
        <span class="badge">Под заказ</span>
        <div class="product-image">🌀</div>
        <h3 class="product-name">Кованые диски VR-01</h3>
        <p class="product-price">от 45 000 ₽ / шт.</p>
        <button class="btn-buy">Конфигуратор</button>
    </div>

    <div class="product-card">
        <span class="badge">Новинка</span>
        <div class="product-image">🔩</div>
        <h3 class="product-name">Болты усиленные</h3>
        <p class="product-price">350 ₽ / шт.</p>
        <button class="btn-buy">Добавить в корзину</button>
    </div>
</div>

<div class="cart-bar">
    <span>🛒</span>
    <span style="font-weight: 600;">Корзина: 0 ₽</span>
</div>

</body>
</html>
