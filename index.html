<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veltrix | Custom Engineering</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        /* ПЕРЕМЕННЫЕ ТЕМ */
        :root {
            /* Темная тема (по умолчанию) */
            --bg: #0f1113;
            --card-bg: #1a1d21;
            --text-main: #f8fafc;
            --text-muted: #888;
            --border: rgba(255, 255, 255, 0.1);
            --accent-orange: linear-gradient(90deg, #ff8c00 0%, #ff5e00 100%);
            --header-bg: rgba(15, 17, 19, 0.8);
        }

        [data-theme="light"] {
            /* Светлая тема */
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #666;
            --border: rgba(0, 0, 0, 0.1);
            --header-bg: rgba(255, 255, 255, 0.8);
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--header-bg);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 1000;
        }

        .controls { display: flex; gap: 15px; align-items: center; }

        /* Кнопка переключения темы */
        #theme-toggle {
            background: var(--border);
            border: none;
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .hero {
            height: 50vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .hero h1 { font-size: clamp(35px, 7vw, 70px); font-weight: 900; margin: 0; text-transform: uppercase; }

        .grid-container {
            max-width: 1100px;
            margin: 0 auto 100px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            padding: 0 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 25px;
            transition: 0.3s ease;
        }

        .card:hover { border-color: #ff8c00; transform: translateY(-5px); }

        .card-img {
            width: 100%;
            height: 200px;
            background: rgba(0,0,0,0.05);
            border-radius: 15px;
            display: flex; align-items: center; justify-content: center; font-size: 60px;
            margin-bottom: 20px;
        }

        .buy-btn {
            background: var(--accent-orange);
            color: white; border: none; width: 100%; padding: 15px;
            border-radius: 12px; font-weight: bold; cursor: pointer;
        }

        /* Корзина */
        .sidebar {
            position: fixed; right: -100%; top: 0; width: 350px; height: 100%;
            background: var(--card-bg); box-shadow: -5px 0 30px rgba(0,0,0,0.2);
            transition: 0.4s; padding: 30px; z-index: 2000;
        }
        .sidebar.active { right: 0; }
    </style>
</head>
<body data-theme="dark">

<header>
    <div style="display:flex; align-items:center; gap:10px;">
        <span style="font-weight:900; font-size:22px;">VELTRIX</span>
    </div>
    
    <div class="controls">
        <button id="theme-toggle">🌓 Тема</button>
        <button onclick="toggleCart()" style="background:none; border:1px solid var(--border); color:var(--text-main); padding:8px 15px; border-radius:20px; cursor:pointer;">
            🛒 <span id="count">0</span>
        </button>
    </div>
</header>

<section class="hero">
    <h1>VELTRIX FORGED</h1>
    <p style="color:var(--text-muted)">Премиальные проставки и кованые диски под любой автомобиль.</p>
</section>

<div class="grid-container">
    <div class="card">
        <div class="card-img">⚙️</div>
        <h3>Проставки 20мм</h3>
        <p style="color:var(--text-muted)">Авиационный алюминий Д16Т.</p>
        <div style="font-size:24px; font-weight:900; margin:15px 0;">4 500 ₽</div>
        <button class="buy-btn" onclick="addToCart('Проставки 20мм', 4500)">В корзину</button>
    </div>

    <div class="card">
        <div class="card-img">🎡</div>
        <h3>Диски VR-Forged</h3>
        <p style="color:var(--text-muted)">Индивидуальный дизайн и вылет.</p>
        <div style="font-size:24px; font-weight:900; margin:15px 0;">55 000 ₽</div>
        <button class="buy-btn" onclick="addToCart('Диски VR-Forged', 55000)">Заказать</button>
    </div>
</div>

<div class="sidebar" id="sidebar">
    <h2>КОРЗИНА</h2>
    <div id="cart-list"></div>
    <hr style="border:0; border-top:1px solid var(--border); margin:20px 0;">
    <div id="total" style="font-weight:bold; font-size:20px;">Итого: 0 ₽</div>
    <button class="buy-btn" style="margin-top:20px;" onclick="toggleCart()">Закрыть</button>
</div>

<script>
    // ПЕРЕКЛЮЧЕНИЕ ТЕМЫ
    const themeToggle = document.getElementById('theme-toggle');
    const body = document.body;

    // Проверяем сохраненную тему
    if (localStorage.getItem('theme') === 'light') {
        body.setAttribute('data-theme', 'light');
    }

    themeToggle.addEventListener('click', () => {
        if (body.getAttribute('data-theme') === 'dark') {
            body.setAttribute('data-theme', 'light');
            localStorage.setItem('theme', 'light');
        } else {
            body.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
        }
    });

    // КОРЗИНА
    let cart = [];
    function addToCart(name, price) {
        cart.push({name, price});
        updateUI();
    }

    function toggleCart() {
        document.getElementById('sidebar').classList.toggle('active');
    }

    function updateUI() {
        document.getElementById('count').innerText = cart.length;
        const list = document.getElementById('cart-list');
        list.innerHTML = cart.map(i => `<div style="display:flex; justify-content:space-between; margin:10px 0;"><span>${i.name}</span><b>${i.price}₽</b></div>`).join('');
        const sum = cart.reduce((a, b) => a + b.price, 0);
        document.getElementById('total').innerText = `Итого: ${sum} ₽`;
    }
</script>

</body>
</html>
